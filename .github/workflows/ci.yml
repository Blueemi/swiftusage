name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # The package needs the macOS 26 SDK (Liquid Glass) and Swift 6.2 tools.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # The same build scripts/build-app.sh makes for a release: optimized, for Apple silicon and Intel.
      - name: Build release
        run: swift build -c release --product swiftusage --arch arm64 --arch x86_64
